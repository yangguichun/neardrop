plugins {
    id 'com.android.application'
}

android {
    namespace 'com.huajie.neardrop'
    compileSdk 34

    defaultConfig {
        applicationId "com.huajie.neardrop"
        minSdk 26
        targetSdk 34
        versionCode 9
        versionName "1.0.8"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 用 debug 签名，方便直接安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
}
